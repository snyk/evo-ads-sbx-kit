version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1

jobs:
  security-scans:
    resource_class: small
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - prodsec/security_scans:
          mode: auto

workflows:
  version: 2
  CICD:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - prodsec-orb-runtime
          trusted-branch: main

      - security-scans:
          name: Security Scans
          context:
            - etso_llm
            - prodsec-orb-runtime
